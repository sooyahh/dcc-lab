name: watchdog
# No LLM: wake grokbot when jobs are waiting and the Colab runner is not alive.
on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths: ["queue/**", "failed/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/watchdog.py
        env:
          GROKBOT_WEBHOOK_URL: ${{ secrets.GROKBOT_WEBHOOK_URL }}
          GROKBOT_WEBHOOK_AUTH: ${{ secrets.GROKBOT_WEBHOOK_AUTH }}
