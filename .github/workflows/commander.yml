name: commander
# Cloud commander: a token-free check decides whether there is work; Claude runs only when there is.
on:
  # claude-code-action does not accept push/label events with a custom prompt;
  # those are relayed to workflow_dispatch by relay.yml.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
concurrency:
  group: commander
  cancel-in-progress: false
permissions:
  actions: write
  contents: write
  issues: write
  id-token: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Verify secrets are set (values never printed)
        env:
          A: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          B: ${{ secrets.TEAM_REPO_TOKEN }}
          C: ${{ secrets.GROKBOT_WEBHOOK_URL }}
        run: |
          for n in A:CLAUDE_CODE_OAUTH_TOKEN B:TEAM_REPO_TOKEN C:GROKBOT_WEBHOOK_URL; do
            v=${n%%:*}; name=${n#*:}
            if [ -n "${!v}" ]; then echo "$name: set (${#v} chars var)"; else echo "::warning::$name is empty or missing"; fi
          done
          [ -n "$A" ] && [ -n "$B" ] || { echo "::error::required secret missing"; exit 1; }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: eigensinn-dcc2026/prelim
          token: ${{ secrets.TEAM_REPO_TOKEN }}
          path: team
          fetch-depth: 0
      - name: Clean secrets (strip BOM/whitespace added by PowerShell pipes)
        env:
          RAW_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RAW_TEAM: ${{ secrets.TEAM_REPO_TOKEN }}
        run: |
          clean(){ printf '%s' "$1" | python3 -c 'import sys;print(sys.stdin.read().lstrip(chr(0xfeff)).strip())'; }
          C=$(clean "$RAW_CLAUDE"); T=$(clean "$RAW_TEAM")
          [[ $C == sk-ant-* ]] || { echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not a Claude token"; exit 1; }
          echo "::add-mask::$C"; echo "::add-mask::$T"
          echo "CLAUDE_TOKEN_CLEAN=$C" >> "$GITHUB_ENV"
          echo "TEAM_GH_TOKEN=$T" >> "$GITHUB_ENV"
      - name: Check for work (no LLM)
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/commander_check.py
      - name: Set up Codex
        if: contains(steps.check.outputs.work, '"implement"') || contains(steps.check.outputs.work, '"fix"')
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          npm install -g @openai/codex >/dev/null 2>&1
          # Ubuntu 24.04 runners block unprivileged user namespaces (AppArmor) -> codex's bwrap sandbox fails. Allow it on this ephemeral VM.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 2>/dev/null || true
          mkdir -p ~/.codex && umask 077 && printf '%s' "$CODEX_AUTH_JSON" | python3 -c 'import sys;sys.stdout.write(sys.stdin.read().lstrip(chr(0xfeff)))' > ~/.codex/auth.json
          codex --version
      - name: Implement / fix with Codex
        id: codex
        if: steps.check.outputs.work != '[]'
        env:
          GH_TOKEN: ${{ github.token }}
          TEAM_REPO_DIR: team
          WORK: ${{ steps.check.outputs.work }}
        run: python tools/codex_implement.py
      - name: Commander (Claude)
        if: steps.codex.outputs.rest != '[]' && steps.codex.outputs.rest != ''
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          TEAM_REPO_DIR: team
          # no grokbot webhook here: the "Wake runner" step below dispatches watchdog.yml instead
        with:
          claude_code_oauth_token: ${{ env.CLAUDE_TOKEN_CLEAN }}
          github_token: ${{ github.token }}
          # relay.yml dispatches this workflow with GITHUB_TOKEN, so the actor is the github-actions bot
          allowed_bots: "github-actions"
          prompt: |
            docs/commander_cloud.md 의 지시를 그대로 따른다.
            WORK = ${{ steps.codex.outputs.rest }}
          claude_args: "--max-turns 80 --allowedTools Bash,Read,Write,Edit,Glob,Grep"
      - name: Auto-approve proposals (no LLM; hard limits in tools/auto_approve.py)
        if: always() && steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/auto_approve.py
      - name: Commit dcc-lab state
        if: always() && steps.check.outputs.work != '[]'
        run: |
          rm -f ~/.codex/auth.json
          git config user.name dcc-lab-commander; git config user.email dcc-lab@users.noreply.github.com
          git add -A specs reviews state 2>/dev/null || true
          git diff --cached --quiet || { git commit -qm "commander: state"; git pull -q --rebase; git push -q; }
      - name: Wake runner (dispatch watchdog; GITHUB_TOKEN pushes to queue/ do not trigger it)
        # watchdog pings grokbot only if jobs wait and the runner heartbeat is stale, so this is safe to call often
        if: always() && steps.check.outputs.work != '[]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull -q --rebase || true
          if ls queue/*.json running/*.json >/dev/null 2>&1; then
            gh workflow run watchdog.yml -R "$GITHUB_REPOSITORY" --ref main
          else
            echo "no pending jobs"
          fi
      - name: Chain next step now (re-dispatch if new build/review/fix work appeared)
        # e.g. Codex opened a PR -> review, review FAIL -> fix, fix pushed -> re-review.
        # Only when the work differs from what this run started with, so a stuck item cannot loop.
        if: always() && steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          START: ${{ steps.check.outputs.work }}
        run: |
          git pull -q --rebase || true
          NEXT=$(GITHUB_OUTPUT=/dev/null python tools/commander_check.py | python3 -c '
          import json,os,sys
          start = json.loads(os.environ.get("START") or "[]")
          nxt = [w for w in json.load(sys.stdin) if w["kind"] in ("implement", "review", "fix")]
          print(json.dumps([w for w in nxt if w not in start]))')
          echo "new work: $NEXT"
          [ "$NEXT" = "[]" ] || gh workflow run commander.yml -R "$GITHUB_REPOSITORY" --ref main
